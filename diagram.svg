<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 840" width="1240" height="840" role="img" aria-label="Larkspur agent architecture: how one patient contact moves across phone, text, portal chat and outbound">
  <style>
    .t  { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h  { font-weight: 700; }
    .box    { fill:#f7f9fc; stroke:#2f5d8a; stroke-width:1.4; }
    .warn   { fill:#fff4ee; stroke:#c2410c; stroke-width:1.4; }
    .danger { fill:#fee2e2; stroke:#b91c1c; stroke-width:1.6; }
    .people { fill:#f0fdf4; stroke:#15803d; stroke-width:1.4; }
    .phi    { fill:#f5f3ff; stroke:#6d28d9; stroke-width:1.4; }
    .ln   { stroke:#94a3b8; stroke-width:1.5; fill:none; }
    .dash { stroke:#a78bfa; stroke-width:1.4; fill:none; stroke-dasharray:6 4; }
    .muted { fill:#64748b; }
  </style>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#94a3b8"/>
    </marker>
    <marker id="arwp" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- Header -->
  <text class="t h" x="620" y="30" font-size="20" text-anchor="middle">Larkspur agent: how one contact moves (phone, text, portal chat, outbound)</text>
  <text class="t muted" x="620" y="52" font-size="12.5" text-anchor="middle">Administrative by default, clinical by exception. Verify before you speak. One patient, four doors.</text>

  <!-- 1. Channels -->
  <rect class="box" x="320" y="78" width="140" height="54" rx="10"/>
  <text class="t h" x="390" y="100" font-size="12.5" text-anchor="middle">Phone</text>
  <text class="t" x="390" y="118" font-size="11" text-anchor="middle">PSTN / SIP</text>

  <rect class="box" x="470" y="78" width="140" height="54" rx="10"/>
  <text class="t h" x="540" y="100" font-size="12.5" text-anchor="middle">Text</text>
  <text class="t" x="540" y="118" font-size="11" text-anchor="middle">SMS &#183; 10DLC</text>

  <rect class="box" x="620" y="78" width="140" height="54" rx="10"/>
  <text class="t h" x="690" y="100" font-size="12.5" text-anchor="middle">Portal chat</text>
  <text class="t" x="690" y="118" font-size="11" text-anchor="middle">MyChart</text>

  <rect class="box" x="770" y="78" width="140" height="54" rx="10"/>
  <text class="t h" x="840" y="100" font-size="12.5" text-anchor="middle">Outbound</text>
  <text class="t" x="840" y="118" font-size="11" text-anchor="middle">post-discharge</text>

  <!-- bus to ingress -->
  <path class="ln" d="M390,132 L390,150 M540,132 L540,150 M690,132 L690,150 M840,132 L840,150 M390,150 L840,150 M620,150 L620,168" marker-end="url(#arw)"/>

  <!-- 2. Ingress -->
  <rect class="box" x="320" y="168" width="600" height="66" rx="10"/>
  <text class="t h" x="620" y="190" font-size="13" text-anchor="middle">INGRESS &amp; MEDIA &#8212; Twilio (BAA)</text>
  <text class="t" x="620" y="210" font-size="11" text-anchor="middle">recording notice &#183; barge-in &#183; DTMF &#183; streaming ASR/TTS</text>
  <text class="t muted" x="620" y="226" font-size="11" text-anchor="middle">US region &#183; zero-retention &#183; no vendor training on our data</text>

  <!-- 3. Identity -->
  <path class="ln" d="M620,234 L620,258" marker-end="url(#arw)"/>
  <rect class="box" x="320" y="258" width="600" height="66" rx="10"/>
  <text class="t h" x="620" y="280" font-size="13" text-anchor="middle">IDENTITY, CONSENT, LANGUAGE</text>
  <text class="t" x="620" y="300" font-size="11" text-anchor="middle">per-channel auth: ANI+DOB &#183; OTP to number on file &#183; MyChart SSO</text>
  <text class="t" x="620" y="316" font-size="11" text-anchor="middle">proxy / authorized rep &#183; TCPA opt-in &#183; English + Spanish</text>

  <!-- 4. Safety gate -->
  <path class="ln" d="M620,324 L620,348" marker-end="url(#arw)"/>
  <rect class="warn" x="320" y="348" width="600" height="66" rx="10"/>
  <text class="t h" x="620" y="370" font-size="13" text-anchor="middle">SAFETY GATE &#8212; rule-based, auditable</text>
  <text class="t" x="620" y="390" font-size="11" text-anchor="middle">red-flag / crisis classifier &#183; scope guard</text>
  <text class="t" x="620" y="406" font-size="11" text-anchor="middle">never diagnose or triage &#183; no PHI without verified identity</text>

  <!-- Emergency branch -->
  <path class="ln" d="M920,381 L958,381" marker-end="url(#arw)"/>
  <rect class="danger" x="960" y="336" width="260" height="92" rx="10"/>
  <text class="t h" x="1090" y="358" font-size="12.5" text-anchor="middle">EMERGENCY / HUMAN PATH</text>
  <text class="t" x="1090" y="380" font-size="11" text-anchor="middle">911 guidance if severe &#183; 988 for crisis</text>
  <text class="t" x="1090" y="398" font-size="11" text-anchor="middle">warm transfer to on-call RN 24/7</text>
  <text class="t" x="1090" y="416" font-size="11" text-anchor="middle">context packet &#183; never reassure</text>

  <!-- 5. Orchestration -->
  <path class="ln" d="M620,414 L620,438" marker-end="url(#arw)"/>
  <rect class="box" x="320" y="438" width="600" height="66" rx="10"/>
  <text class="t h" x="620" y="460" font-size="13" text-anchor="middle">ORCHESTRATION</text>
  <text class="t" x="620" y="480" font-size="11" text-anchor="middle">intent state machine + policy rules (deterministic decisions)</text>
  <text class="t" x="620" y="496" font-size="11" text-anchor="middle">LLM for understanding and summary only &#183; one session across all channels</text>

  <!-- 6. Integrations -->
  <path class="ln" d="M620,504 L620,520" marker-end="url(#arw)"/>
  <path class="ln" d="M320,520 L920,520 M376,520 L376,532 M498,520 L498,532 M620,520 L620,532 M742,520 L742,532 M864,520 L864,532" marker-end="url(#arw)"/>

  <rect class="box" x="320" y="532" width="112" height="72" rx="9"/>
  <text class="t h" x="376" y="553" font-size="11.5" text-anchor="middle">Epic on FHIR</text>
  <text class="t" x="376" y="571" font-size="10.5" text-anchor="middle">read: patient,</text>
  <text class="t" x="376" y="586" font-size="10.5" text-anchor="middle">coverage, appts,</text>
  <text class="t" x="376" y="601" font-size="10.5" text-anchor="middle">meds, PA state</text>

  <rect class="box" x="442" y="532" width="112" height="72" rx="9"/>
  <text class="t h" x="498" y="553" font-size="11.5" text-anchor="middle">Epic scheduling</text>
  <text class="t" x="498" y="571" font-size="10.5" text-anchor="middle">write (Cadence)</text>
  <text class="t" x="498" y="586" font-size="10.5" text-anchor="middle">via Redox</text>
  <text class="t" x="498" y="601" font-size="10.5" text-anchor="middle">middleware</text>

  <rect class="box" x="564" y="532" width="112" height="72" rx="9"/>
  <text class="t h" x="620" y="553" font-size="11.5" text-anchor="middle">Epic In Basket</text>
  <text class="t" x="620" y="571" font-size="10.5" text-anchor="middle">task / patient</text>
  <text class="t" x="620" y="586" font-size="10.5" text-anchor="middle">message to the</text>
  <text class="t" x="620" y="601" font-size="10.5" text-anchor="middle">right team</text>

  <rect class="box" x="686" y="532" width="112" height="72" rx="9"/>
  <text class="t h" x="742" y="553" font-size="11.5" text-anchor="middle">Payer</text>
  <text class="t" x="742" y="571" font-size="10.5" text-anchor="middle">eligibility 270/271</text>
  <text class="t" x="742" y="586" font-size="10.5" text-anchor="middle">+ PA status</text>
  <text class="t" x="742" y="601" font-size="10.5" text-anchor="middle">pVerify / Availity</text>

  <rect class="box" x="808" y="532" width="112" height="72" rx="9"/>
  <text class="t h" x="864" y="553" font-size="11.5" text-anchor="middle">Pharmacy</text>
  <text class="t" x="864" y="571" font-size="10.5" text-anchor="middle">formulary check</text>
  <text class="t" x="864" y="586" font-size="10.5" text-anchor="middle">+ language line</text>
  <text class="t" x="864" y="601" font-size="10.5" text-anchor="middle">for interpreters</text>

  <!-- 7. Actions -->
  <path class="ln" d="M620,604 L620,618" marker-end="url(#arw)"/>
  <path class="ln" d="M320,618 L920,618 M390,618 L390,634 M543,618 L543,634 M696,618 L696,634 M849,618 L849,634" marker-end="url(#arw)"/>

  <rect class="box" x="320" y="634" width="140" height="72" rx="9"/>
  <text class="t h" x="390" y="658" font-size="11.5" text-anchor="middle">Book / move</text>
  <text class="t" x="390" y="678" font-size="10.5" text-anchor="middle">appointment</text>
  <text class="t muted" x="390" y="696" font-size="10" text-anchor="middle">within policy</text>

  <rect class="box" x="473" y="634" width="140" height="72" rx="9"/>
  <text class="t h" x="543" y="658" font-size="11.5" text-anchor="middle">Refill</text>
  <text class="t" x="543" y="678" font-size="10.5" text-anchor="middle">to prescriber queue</text>
  <text class="t muted" x="543" y="696" font-size="10" text-anchor="middle">never auto-approved</text>

  <rect class="box" x="626" y="634" width="140" height="72" rx="9"/>
  <text class="t h" x="696" y="658" font-size="11.5" text-anchor="middle">PA / eligibility</text>
  <text class="t" x="696" y="678" font-size="10.5" text-anchor="middle">answer, or task</text>
  <text class="t muted" x="696" y="696" font-size="10" text-anchor="middle">+ promised callback</text>

  <rect class="box" x="779" y="634" width="140" height="72" rx="9"/>
  <text class="t h" x="849" y="658" font-size="11.5" text-anchor="middle">Results</text>
  <text class="t" x="849" y="678" font-size="10.5" text-anchor="middle">portal or callback</text>
  <text class="t muted" x="849" y="696" font-size="10" text-anchor="middle">never in SMS</text>

  <!-- PHI panel -->
  <rect class="phi" x="20" y="438" width="270" height="310" rx="10"/>
  <text class="t h" x="36" y="466" font-size="13" fill="#5b21b6">PHI &amp; AUDIO STORE</text>
  <text class="t" x="36" y="484" font-size="10.5" fill="#6d28d9">encrypted &#183; audit-logged &#183; minimum necessary</text>
  <text class="t" x="36" y="514" font-size="11">&#183; Default: transcribe-and-discard</text>
  <text class="t" x="52" y="531" font-size="11">no raw audio persisted</text>
  <text class="t" x="36" y="559" font-size="11">&#183; Opt-in: clinic-controlled</text>
  <text class="t" x="52" y="576" font-size="11">retention (e.g. 30 days)</text>
  <text class="t" x="36" y="604" font-size="11">&#183; Transcript + summary to Epic</text>
  <text class="t" x="36" y="632" font-size="11">&#183; Never in a vendor training set</text>
  <text class="t" x="36" y="660" font-size="11">&#183; De-identified analytics only</text>
  <text class="t" x="36" y="688" font-size="11">&#183; Subprocessor BAA registry the</text>
  <text class="t" x="52" y="705" font-size="11">privacy officer can read</text>

  <path class="dash" d="M290,470 L318,470" marker-end="url(#arwp)"/>
  <path class="dash" d="M150,438 L150,210 L316,210" marker-end="url(#arwp)"/>

  <!-- People panel -->
  <rect class="people" x="960" y="450" width="260" height="298" rx="10"/>
  <text class="t h" x="976" y="478" font-size="13" fill="#166534">PEOPLE &#8212; humans own judgment</text>
  <text class="t" x="976" y="508" font-size="11">&#183; On-call RN / nurse triage line</text>
  <text class="t" x="992" y="525" font-size="11">(warm transfer)</text>
  <text class="t" x="976" y="553" font-size="11">&#183; Front desk / MA task queue</text>
  <text class="t" x="976" y="581" font-size="11">&#183; Supervisor dashboard</text>
  <text class="t" x="992" y="598" font-size="11">+ kill switch</text>
  <text class="t" x="976" y="626" font-size="11">&#183; 100% transcript review in</text>
  <text class="t" x="992" y="643" font-size="11">shadow mode, sampled after</text>
  <text class="t" x="976" y="671" font-size="11">&#183; Clinician sign-off on all</text>
  <text class="t" x="992" y="688" font-size="11">clinical scripts</text>
  <text class="t" x="976" y="716" font-size="11">&#183; Escalate loudly, never reassure</text>
  <path class="dash" d="M922,470 L958,470" marker-end="url(#arwp)"/>

  <!-- Legend -->
  <rect class="box" x="320" y="760" width="16" height="12" rx="3"/>
  <text class="t muted" x="344" y="771" font-size="11">Agent</text>
  <rect class="warn" x="400" y="760" width="16" height="12" rx="3"/>
  <text class="t muted" x="424" y="771" font-size="11">Safety</text>
  <rect class="danger" x="488" y="760" width="16" height="12" rx="3"/>
  <text class="t muted" x="512" y="771" font-size="11">Emergency / human</text>
  <rect class="people" x="656" y="760" width="16" height="12" rx="3"/>
  <text class="t muted" x="680" y="771" font-size="11">People / QA</text>
  <rect class="phi" x="776" y="760" width="16" height="12" rx="3"/>
  <text class="t muted" x="800" y="771" font-size="11">PHI &#183; purple = audio/PHI path</text>
</svg>
